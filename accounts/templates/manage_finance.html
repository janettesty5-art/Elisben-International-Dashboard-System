<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Finance</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
        }
        
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .navbar a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
        }
        
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .form-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }
        
        .form-card h2 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group.full-width {
            grid-column: span 2;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        
        .btn-submit:hover {
            opacity: 0.9;
        }
        
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
        }
        
        /* Search Box Styles */
        .search-box {
            position: relative;
            margin-bottom: 15px;
        }
        
        .search-input {
            width: 100%;
            padding: 12px 40px 12px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
        }
        
        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }
        
        .student-option {
            padding: 8px;
        }
        
        .student-option:hover {
            background: #f0f0f0;
        }

        .student-list {
    max-height: 320px;
    overflow-y: auto;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.student-card {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    border: 2px solid transparent;
    background: #f8f9fa;
    word-break: break-word;
    overflow-wrap: break-word;
}
.student-card:hover { background: #eef1ff; }
.student-card.selected { border-color: #667eea; background: #eef1ff; }
.student-card input[type="radio"] { flex-shrink: 0; width: 18px; height: 18px; accent-color: #667eea; }
.student-card-id { font-weight: 700; color: #667eea; font-family: monospace; white-space: nowrap; flex-shrink: 0; }
.student-card-name { color: #333; flex: 1; min-width: 150px; word-break: break-word; }
    
@media (max-width: 720px) {
    .form-grid { grid-template-columns: 1fr; }
}

@media (max-width: 768px) {
    .navbar { flex-direction: column; gap: 10px; text-align: center; }
}
</style>
</head>
<body>
    <nav class="navbar">
        <h1><i class="fa-solid fa-sack-dollar"></i> Manage Finance</h1>
        <a href="{% if is_admin %}{% url 'admin_dashboard' %}{% else %}{% url 'bursar_dashboard' %}{% endif %}"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
    </nav>
    
    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        
        <!-- Record Payment Form -->
        <div class="form-card">
            <h2><i class="fa-solid fa-credit-card"></i> Record New Payment</h2>
            
            <form method="POST">
                {% csrf_token %}
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="student_id">Student ID *</label>
                        
                        <!-- Search Box -->
                        <div class="search-box">
                            <input type="text" 
                                   id="student_search" 
                                   class="search-input" 
                                   placeholder="Search by name or ID..." 
                                   onkeyup="filterStudents()">
                            <span class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
                        </div>
                        
                        <div class="student-list" id="studentList">
    {% for student in students %}
    <label class="student-card" data-name="{{ student.full_name|lower }}" data-id="{{ student.student_id|lower }}">
        <input type="radio" name="student_id" value="{{ student.student_id }}" required onclick="markSelected(this)">
        <span class="student-card-id">{{ student.student_id }}</span>
        <span class="student-card-name">{{ student.full_name }}</span>
    </label>
    {% empty %}
    <p style="padding:15px; color:#999;">No students registered yet.</p>
    {% endfor %}
</div>
                    </div>
                    
                    <div class="form-group">
                        <label for="total_fee">Total Fee (₦) *</label>
                        <input type="number" name="total_fee" id="total_fee" step="0.01" min="0" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="amount_paid">Amount Paid (₦) *</label>
                        <input type="number" name="amount_paid" id="amount_paid" step="0.01" min="0" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="fee_type">Fee Type *</label>
                        <select name="fee_type" id="fee_type" required>
                            <option value="">-- Select Fee Type --</option>
                            <option value="Tuition Fee">Tuition Fee</option>
                            <option value="Exam Fee">Exam Fee</option>
                            <option value="Library Fee">Library Fee</option>
                            <option value="Sport Fee">Sport Fee</option>
                            <option value="Transport Fee">Transport Fee</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="payment_method">Payment Method *</label>
                        <select name="payment_method" id="payment_method" required>
                            <option value="">-- Select Method --</option>
                            <option value="Cash">Cash</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                            <option value="Card">Card</option>
                        </select>
                    </div>
                    
                    <div class="form-group full-width">
                        <label for="payment_date">Payment Date *</label>
                        <input type="date" name="payment_date" id="payment_date" required>
                    </div>
                </div>
                
                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-sack-dollar"></i> Record Payment
                </button>
            </form>
        </div>
    </div>
    
<script>
    // Set today's date as default
    document.getElementById('payment_date').valueAsDate = new Date();

    // Highlight whichever student card is selected
    function markSelected(clickedInput) {
        document.querySelectorAll('.student-card').forEach(card => card.classList.remove('selected'));
        clickedInput.closest('.student-card').classList.add('selected');
    }

    // Filter student cards as the admin/bursar types
    function filterStudents() {
        const searchInput = document.getElementById('student_search').value.toLowerCase().trim();
        const cards = document.querySelectorAll('.student-card');
        let visibleCount = 0;

        cards.forEach(card => {
            const name = card.getAttribute('data-name') || '';
            const id = card.getAttribute('data-id') || '';
            const matches = name.includes(searchInput) || id.includes(searchInput);
            card.style.display = matches ? '' : 'none';
            if (matches) visibleCount++;
        });

        showNoResultsMessage(visibleCount);
    }

    // Show a friendly message if a search matches nobody
    function showNoResultsMessage(visibleCount) {
        const list = document.getElementById('studentList');
        let noResultsMsg = document.getElementById('noResultsMsg');

        if (visibleCount === 0) {
            if (!noResultsMsg) {
                noResultsMsg = document.createElement('p');
                noResultsMsg.id = 'noResultsMsg';
                noResultsMsg.style.cssText = 'padding:15px; color:#999; text-align:center;';
                noResultsMsg.textContent = 'No students match your search.';
                list.appendChild(noResultsMsg);
            }
            noResultsMsg.style.display = '';
        } else if (noResultsMsg) {
            noResultsMsg.style.display = 'none';
        }
    }
</script>
</body>
</html>
