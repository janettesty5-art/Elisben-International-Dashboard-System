<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print ID Cards</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f7fa; }

        .navbar { background: linear-gradient(135deg, #34495e 0%, #2c3e50 100%); color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
        .navbar h1 { font-size: 20px; }
        .navbar a { color: white; text-decoration: none; padding: 10px 20px; background: rgba(255,255,255,0.2); border-radius: 8px; }

        .toolbar { text-align: center; margin: 25px 0; }
        .btn { padding: 14px 28px; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; margin: 6px; }
        .btn-print { background: #2ecc71; color: white; }
        .btn-print:hover { background: #27ae60; }
        .btn-back { background: #95a5a6; color: white; }

        /* ===== A4 PRINT SHEET ===== */
        @page { size: A4; margin: 10mm; }
        .sheet-wrap { display: flex; justify-content: center; padding-bottom: 60px; }
        .print-sheet {
            display: grid;
            grid-template-columns: repeat(2, 3.4in);
            grid-auto-rows: 2.15in;
            gap: 0.35in;
            background: white;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .print-sheet .id-card { border: 1px dashed #bbb; }

        /* ===== CARD VISUAL (same as view_id_card.html) ===== */
        .id-card {
            width: 3.4in; height: 2.15in;
            border-radius: 14px;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: white;
            display: flex;
            flex-direction: column;
        }
        .id-card-header { background: linear-gradient(135deg, var(--c1), var(--c2)); color: white; padding: 8px 10px; display: flex; align-items: center; gap: 8px; }
        .id-card-logo, .id-card-logo-img { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; }
        .id-card-logo { background: white; color: var(--c1); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 13px; }
        .id-card-logo-img { object-fit: cover; background: white; }
        .id-card-school-name { font-size: 11px; font-weight: 800; line-height: 1.15; }
        .id-card-school-sub { font-size: 7.5px; opacity: .85; }
        .id-card-body { flex: 1; display: flex; padding: 10px; gap: 10px; align-items: center; }
        .id-card-photo { width: 0.95in; height: 1.15in; border-radius: 8px; object-fit: cover; border: 2px solid #eee; background: #f0f0f0; flex-shrink: 0; }
        .id-card-photo-placeholder { display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: #bbb; }
        .id-card-info { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 3px; min-width: 0; }
        .id-card-name { font-size: 12.5px; font-weight: 800; color: #222; line-height: 1.2; word-break: break-word; }
        .id-card-role { font-size: 9.5px; font-weight: 700; color: var(--c1); text-transform: uppercase; }
        .id-card-id { font-size: 9.5px; color: #555; margin-top: 3px; font-family: 'Courier New', monospace; }
        .id-card-phone { font-size: 9px; color: #777; }
        .id-card-footer { background: #f4f4f4; padding: 5px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .id-card-barcode { display: flex; gap: 1px; align-items: flex-end; height: 16px; }
        .id-card-barcode span { background: #333; display: inline-block; }
        .id-card-valid { font-size: 6.5px; color: #888; white-space: nowrap; }

        @media print {
            .no-print { display: none !important; }
            body { background: white; }
            .sheet-wrap { padding: 0; }
            .print-sheet { box-shadow: none; padding: 0; }
            .print-sheet .id-card { border: 1px dashed #ccc; }
        }
    
@media (max-width: 768px) {
    .navbar { flex-direction: column; gap: 10px; text-align: center; }
}
</style>
</head>
<body>
    <nav class="navbar no-print">
        <h1><i class="fa-solid fa-print"></i> Print ID Cards ({{ cards|length }} selected)</h1>
        <a href="{% url 'id_card_hub' %}"><i class="fa-solid fa-arrow-left"></i> Back to ID Card Hub</a>
    </nav>

    <div class="toolbar no-print">
        <button class="btn btn-print" onclick="window.print()"><i class="fa-solid fa-print"></i> Print This Sheet</button>
        <a href="{% url 'id_card_hub' %}" class="btn btn-back"><i class="fa-solid fa-arrow-left"></i> Back to Hub</a>
        <p style="color:#888; font-size:13px; margin-top:10px;">Dashed lines are cut guides and won't show clearly once printed on plain paper — cut along them to separate the {{ cards|length }} card(s).</p>
    </div>

    <div class="sheet-wrap">
        <div class="print-sheet">
            {% for card in cards %}
            {% include '_id_card_snippet.html' %}
            {% endfor %}
        </div>
    </div>
</body>
</html>
