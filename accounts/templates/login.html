<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Elisben International College</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .logo p {
            color: #666;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        select, input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
        }
        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .role-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }
        .role-option {
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }
        .role-option:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }
        .role-option.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        .role-option input[type="radio"] {
            display: none;
        }
        .role-icon {
            font-size: 30px;
            margin-bottom: 8px;
        }
        .role-name {
            font-size: 14px;
            font-weight: 600;
        }
        .new-badge {
            background: #ff4757;
            color: white;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 10px;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🏫 Elisben International College</h1>
            <p>School Management System</p>
        </div>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-error">{{ message }}</div>
            {% endfor %}
        {% endif %}
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label>Select Your Role:</label>
                <div class="role-grid">
                    <label class="role-option">
                        <input type="radio" name="role" value="admin" required>
                        <div class="role-icon">🔑</div>
                        <div class="role-name">Admin</div>
                    </label>
                    
                    <label class="role-option">
                        <input type="radio" name="role" value="principal" required>
                        <div class="role-icon">👔</div>
                        <div class="role-name">Principal</div>
                    </label>
                    
                    <label class="role-option">
                        <input type="radio" name="role" value="teacher" required>
                        <div class="role-icon">👨‍🏫</div>
                        <div class="role-name">Teacher</div>
                    </label>
                    
                    <label class="role-option">
                        <input type="radio" name="role" value="bursar" required>
                        <div class="role-icon">💰</div>
                        <div class="role-name">Bursar</div>
                    </label>
                    
                    <label class="role-option">
                        <input type="radio" name="role" value="student" required>
                        <div class="role-icon">👨‍🎓</div>
                        <div class="role-name">Student</div>
                    </label>
                    
                    <label class="role-option">
                        <input type="radio" name="role" value="make_result" required>
                        <div class="role-icon">📊</div>
                        <div class="role-name">Make Result<span class="new-badge">NEW</span></div>
                    </label>
                    
                    <label class="role-option">
                        <input type="radio" name="role" value="check_result" required>
                        <div class="role-icon">📋</div>
                        <div class="role-name">Check Result<span class="new-badge">NEW</span></div>
                    </label>
                </div>
            </div>
            
            <div class="form-group" id="id-field">
                <label>Enter Your ID:</label>
                <input type="text" name="user_id" placeholder="Enter your ID number" required>
            </div>
            
            <div class="form-group" id="pin-field" style="display: none;">
                <label>Enter Your PIN:</label>
                <input type="text" name="result_pin" placeholder="Enter 12-digit PIN" maxlength="12">
            </div>
            
            <button type="submit" class="btn-login">Login</button>
        </form>
    </div>
    
    <script>
    // Handle role selection visual feedback
    const roleOptions = document.querySelectorAll('.role-option');
    const idField = document.getElementById('id-field');
    const pinField = document.getElementById('pin-field');
    
    roleOptions.forEach(option => {
        option.addEventListener('click', function() {
            roleOptions.forEach(opt => opt.classList.remove('active'));
            this.classList.add('active');
            this.querySelector('input[type="radio"]').checked = true;
            
            // Show PIN field for check_result, ID field for others
            const roleValue = this.querySelector('input[type="radio"]').value;
            if (roleValue === 'check_result') {
                idField.style.display = 'none';
                pinField.style.display = 'block';
                idField.querySelector('input').required = false;
                pinField.querySelector('input').required = true;
            } else {
                idField.style.display = 'block';
                pinField.style.display = 'none';
                idField.querySelector('input').required = true;
                pinField.querySelector('input').required = false;
            }
        });
    });

    // ✅ NEW: Intercept form submission for "Check Result" to show bulletin first
    const loginForm = document.querySelector('form');
    loginForm.addEventListener('submit', function(e) {
        const selectedRole = document.querySelector('input[name="role"]:checked');
        
        if (selectedRole && selectedRole.value === 'check_result') {
            e.preventDefault();  // Stop form submission
            
            // Get the PIN value
            const pinValue = document.querySelector('input[name="result_pin"]').value;
            
            // Store PIN in sessionStorage so we can use it after bulletin
            sessionStorage.setItem('result_pin', pinValue);
            
            // Redirect to bulletin page
            window.location.href = "{% url 'result_bulletin' %}";
        }
    });
</script>

</body>
</html>
