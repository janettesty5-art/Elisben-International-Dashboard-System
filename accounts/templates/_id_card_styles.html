{% comment %}Shared ID card CSS. Include inside <head> on every page that renders _id_card_snippet.html{% endcomment %}
<style>
    .id-card {
        width: 3.4in; height: 2.15in;
        border-radius: 14px;
        overflow: hidden;
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        border: 1px solid #ddd;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        break-inside: avoid;
        page-break-inside: avoid;
    }
    .id-card * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }
    .id-card-header {
        background: linear-gradient(135deg, var(--c1), var(--c2));
        background-color: var(--c1);
        color: #fff; padding: 8px 10px;
        display: flex; align-items: center; gap: 8px;
        flex-shrink: 0;
    }
    .id-card-logo, .id-card-logo-img { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; }
    .id-card-logo { background: #fff; color: var(--c1); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 13px; }
    .id-card-logo-img { object-fit: cover; background: #fff; border: 1px solid rgba(255,255,255,.6); }
    .id-card-school-name { font-size: 11px; font-weight: 800; line-height: 1.15; }
    .id-card-school-sub { font-size: 7.5px; opacity: .88; }

    .id-card-body { flex: 1; display: flex; padding: 10px; gap: 10px; align-items: center; min-height: 0; }
    .id-card-photo { width: 0.95in; height: 1.15in; border-radius: 8px; object-fit: cover; border: 2px solid #eee; background: #f0f0f0; flex-shrink: 0; }
    .id-card-photo-placeholder {
        display: flex; align-items: center; justify-content: center;
        font-size: 30px; font-weight: 800; color: #fff;
        background: linear-gradient(135deg, var(--c1), var(--c2));
        background-color: var(--c1);
        text-transform: uppercase;
    }
    .id-card-info { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; }
    .id-card-name { font-size: 12.5px; font-weight: 800; color: #222; line-height: 1.2; word-break: break-word; }
    .id-card-role { font-size: 9.5px; font-weight: 700; color: var(--c1); text-transform: uppercase; letter-spacing: .3px; }
    .id-card-role-top { font-size: 11px; font-weight: 800; margin-bottom: 2px; line-height: 1.15; }
    .id-card-name-sub { font-size: 11.5px; font-weight: 700; color: #222; line-height: 1.2; word-break: break-word; }
    .id-card-id { font-size: 9.5px; color: #555; margin-top: 3px; font-family: 'Courier New', monospace; }
    .id-card-phone { font-size: 9px; color: #777; }

    .id-card-footer { background: #f4f4f4; padding: 5px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0; }
    .id-card-barcode { display: flex; gap: 1px; align-items: flex-end; height: 16px; }
    .id-card-barcode span { background: #333; display: inline-block; }
    .id-card-valid { font-size: 6.5px; color: #888; white-space: nowrap; }

    /* Phone screens: let the card shrink instead of overflowing */
    @media screen and (max-width: 768px) {
        .id-card { width: 100%; max-width: 3.4in; height: auto; min-height: 2.15in; }
    }
    /* Printing: always force the exact physical size */
    @media print {
        .id-card { width: 3.4in !important; height: 2.15in !important; max-width: none !important; box-shadow: none !important; }
    }
</style>
