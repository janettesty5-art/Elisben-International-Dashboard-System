<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Payment Record</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f7fa; }
        .navbar { background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%); color: white; padding: 20px 40px; }
        .navbar h1 { font-size: 24px; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input, select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 15px; }
        input:focus, select:focus { outline: none; border-color: #f39c12; }
        .btn { padding: 12px 30px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin-right: 10px; text-decoration: none; display: inline-block; }
        .btn-save { background: #28a745; color: white; }
        .btn-save:hover { background: #218838; }
        .btn-cancel { background: #6c757d; color: white; }
        .btn-cancel:hover { background: #5a6268; }
        .alert { padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-error { background: #f8d7da; color: #721c24; }
        .info-box { background: #e7f3ff; border-left: 4px solid #2196F3; padding: 15px; margin-bottom: 25px; border-radius: 5px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>✏️ Edit Payment Record</h1>
    </nav>
    
    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}error{% else %}success{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        
        <div class="card">
            <div class="info-box">
                <strong>📌 Note:</strong> You can edit any part of this payment record. The balance will be recalculated automatically.
            </div>
            
            <form method="POST">
                {% csrf_token %}
                
                <div class="form-group">
                    <label>Student: <span style="color: red;">*</span></label>
                    <select name="student_id" required>
                        {% for student in students %}
                        <option value="{{ student.student_id }}" {% if student.id == record.student.id %}selected{% endif %}>
                            {{ student.student_id }} - {{ student.full_name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Total Fee (₦): <span style="color: red;">*</span></label>
                    <input type="number" name="total_fee" value="{{ record.total_fee }}" step="0.01" min="0" required>
                </div>
                
                <div class="form-group">
                    <label>Amount Paid (₦): <span style="color: red;">*</span></label>
                    <input type="number" name="amount_paid" value="{{ record.amount_paid }}" step="0.01" min="0" required>
                </div>
                
                <div class="form-group">
                    <label>Fee Type: <span style="color: red;">*</span></label>
                    <select name="fee_type" required>
                        <option value="Tuition Fee" {% if record.fee_type == "Tuition Fee" %}selected{% endif %}>Tuition Fee</option>
                        <option value="Exam Fee" {% if record.fee_type == "Exam Fee" %}selected{% endif %}>Exam Fee</option>
                        <option value="Library Fee" {% if record.fee_type == "Library Fee" %}selected{% endif %}>Library Fee</option>
                        <option value="Sport Fee" {% if record.fee_type == "Sport Fee" %}selected{% endif %}>Sport Fee</option>
                        <option value="Transport Fee" {% if record.fee_type == "Transport Fee" %}selected{% endif %}>Transport Fee</option>
                        <option value="Other" {% if record.fee_type == "Other" %}selected{% endif %}>Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Payment Method: <span style="color: red;">*</span></label>
                    <select name="payment_method" required>
                        <option value="Cash" {% if record.payment_method == "Cash" %}selected{% endif %}>Cash</option>
                        <option value="Bank Transfer" {% if record.payment_method == "Bank Transfer" %}selected{% endif %}>Bank Transfer</option>
                        <option value="Card" {% if record.payment_method == "Card" %}selected{% endif %}>Card</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Payment Date: <span style="color: red;">*</span></label>
                    <input type="date" name="payment_date" value="{{ record.payment_date|date:'Y-m-d' }}" required>
                </div>
                
                <div style="margin-top: 30px;">
                    <button type="submit" class="btn btn-save">💾 Save Changes</button>
                    <a href="{% url 'bursar_dashboard' %}" class="btn btn-cancel">❌ Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
